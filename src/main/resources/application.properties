spring.application.name=bellavistaerp

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/bellavista_db
spring.datasource.username=postgres
spring.datasource.password=password

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Database Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# Server Configuration
server.port=8080

# Authentication
# Show the reason in error responses (the Flutter app displays it)
server.error.include-message=always
app.auth.enabled=true
# Leave empty for a random key at each start, or set BV_AUTH_SECRET (32+ random characters)
app.auth.secret=${BV_AUTH_SECRET:}
app.auth.token-hours=8
app.auth.admin-email=ho@bellavista.ac.zw
app.auth.admin-password=${BV_ADMIN_PASSWORD:Bella@2026}
